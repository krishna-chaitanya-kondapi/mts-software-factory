<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="t d"><title id="t">Reviewability lifecycle</title><desc id="d">Review, refine, persist, verify and learn. Draft canonical source, pending visual approval.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="590" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172033"><text x="28" y="35" font-size="24" font-weight="bold">Reviewability lifecycle</text><text x="28" y="58" font-size="14" fill="#475569">Review, refine, persist, verify and learn</text><rect x="200" y="83" width="560" height="58" rx="8" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="480" y="108" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">Define review intent</text><text x="480" y="130" text-anchor="middle" font-size="13">Human</text><path d="M480 141V149" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="200" y="151" width="560" height="58" rx="8" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="480" y="176" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">Classify and retrieve evidence</text><text x="480" y="198" text-anchor="middle" font-size="13">Agent</text><path d="M480 209V217" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="200" y="219" width="560" height="58" rx="8" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="480" y="244" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">Select minimum sufficient pattern</text><text x="480" y="266" text-anchor="middle" font-size="13">Agent</text><path d="M480 277V285" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="200" y="287" width="560" height="58" rx="8" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="480" y="312" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">Author and render canonical source</text><text x="480" y="334" text-anchor="middle" font-size="13">Agent / tools</text><path d="M480 345V353" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="200" y="355" width="560" height="58" rx="8" fill="#a16207" fill-opacity=".07" stroke="#a16207"/><text x="480" y="380" text-anchor="middle" font-size="17" font-weight="bold" fill="#a16207">Review and approve exact revision</text><text x="480" y="402" text-anchor="middle" font-size="13">Human</text><path d="M480 413V421" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="200" y="423" width="560" height="58" rx="8" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="480" y="448" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">Commit and verify readback</text><text x="480" y="470" text-anchor="middle" font-size="13">Repository</text><path d="M480 481V489" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="200" y="491" width="560" height="58" rx="8" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="480" y="516" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">Learn and approve reusable improvements</text><text x="480" y="538" text-anchor="middle" font-size="13">Human / agent</text><path d="M200 382H100V314H200" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><text x="85" y="350" text-anchor="middle" font-size="12" transform="rotate(-90 85 350)">Refine / reverify</text><text x="28" y="576" font-size="12" fill="#64748b">Reviewability Engineering 1.0.0 · Draft visual · Pending visual approval</text></g></svg>
