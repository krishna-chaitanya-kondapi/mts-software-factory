<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d"><title id="t">Four review levels</title><desc id="d">Breadth first, depth on demand; not a maturity ladder. Draft canonical source, pending visual approval.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="540" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172033"><text x="28" y="35" font-size="24" font-weight="bold">Four review levels</text><text x="28" y="58" font-size="14" fill="#475569">Breadth first, depth on demand; not a maturity ladder</text><rect x="55" y="90" width="850" height="75" rx="8" fill="#2563eb" fill-opacity=".07" stroke="#2563eb"/><text x="480" y="115" text-anchor="middle" font-size="17" font-weight="bold" fill="#2563eb">1 — Conceptual Foundation</text><text x="480" y="137" text-anchor="middle" font-size="13">Purpose, boundaries, concepts and context</text><path d="M480 165V192" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="115" y="195" width="730" height="75" rx="8" fill="#7c3aed" fill-opacity=".07" stroke="#7c3aed"/><text x="480" y="220" text-anchor="middle" font-size="17" font-weight="bold" fill="#7c3aed">2 — Logical Design</text><text x="480" y="242" text-anchor="middle" font-size="13">Relationships, flows, contracts and choices</text><path d="M480 270V297" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="175" y="300" width="610" height="75" rx="8" fill="#0d9488" fill-opacity=".07" stroke="#0d9488"/><text x="480" y="325" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d9488">3 — Implementation Review</text><text x="480" y="347" text-anchor="middle" font-size="13">Components, controls and real evidence</text><path d="M480 375V402" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="235" y="405" width="490" height="75" rx="8" fill="#475569" fill-opacity=".07" stroke="#475569"/><text x="480" y="430" text-anchor="middle" font-size="17" font-weight="bold" fill="#475569">4 — Technical Details</text><text x="480" y="452" text-anchor="middle" font-size="13">Code, schemas, configurations and algorithms</text><text x="28" y="526" font-size="12" fill="#64748b">Reviewability Engineering 1.0.0 · Draft visual · Pending visual approval</text></g></svg>
