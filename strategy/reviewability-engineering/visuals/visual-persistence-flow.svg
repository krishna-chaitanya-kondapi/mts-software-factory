<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" role="img" aria-labelledby="t d"><title id="t">Canonical visualization persistence</title><desc id="d">The same source travels from review to GitHub. Draft canonical source, pending visual approval.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker></defs><rect width="960" height="550" fill="#fff"/><g font-family="Arial,sans-serif" fill="#172033"><text x="28" y="35" font-size="24" font-weight="bold">Canonical visualization persistence</text><text x="28" y="58" font-size="14" fill="#475569">The same source travels from review to GitHub</text><rect x="180" y="85" width="600" height="67" rx="8" fill="#0d9488" fill-opacity=".07" stroke="#0d9488"/><text x="480" y="110" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d9488">Create canonical SVG</text><text x="480" y="132" text-anchor="middle" font-size="13">One source of truth</text><path d="M480 152V174" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="180" y="176" width="600" height="67" rx="8" fill="#0d9488" fill-opacity=".07" stroke="#0d9488"/><text x="480" y="201" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d9488">Render exact source</text><text x="480" y="223" text-anchor="middle" font-size="13">Human sees the reviewed artifact</text><path d="M480 243V265" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="180" y="267" width="600" height="67" rx="8" fill="#a16207" fill-opacity=".07" stroke="#a16207"/><text x="480" y="292" text-anchor="middle" font-size="17" font-weight="bold" fill="#a16207">Refine and approve</text><text x="480" y="314" text-anchor="middle" font-size="13">Bind revision and SHA-256</text><path d="M480 334V356" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="180" y="358" width="600" height="67" rx="8" fill="#0d9488" fill-opacity=".07" stroke="#0d9488"/><text x="480" y="383" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d9488">Commit exact bytes</text><text x="480" y="405" text-anchor="middle" font-size="13">No recreation or Mermaid conversion</text><path d="M480 425V447" stroke="#64748b" stroke-width="1.6" fill="none" marker-end="url(#a)"/><rect x="180" y="449" width="600" height="67" rx="8" fill="#0d9488" fill-opacity=".07" stroke="#0d9488"/><text x="480" y="474" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d9488">Read back and verify</text><text x="480" y="496" text-anchor="middle" font-size="13">Compare checksum; inspect rendering</text><text x="28" y="536" font-size="12" fill="#64748b">Reviewability Engineering 1.0.0 · Draft visual · Pending visual approval</text></g></svg>
