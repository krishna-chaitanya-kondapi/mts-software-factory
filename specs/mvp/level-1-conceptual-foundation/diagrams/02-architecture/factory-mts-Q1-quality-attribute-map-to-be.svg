<svg xmlns="http://www.w3.org/2000/svg" width="960" height="375" viewBox="0 0 960 375" role="img" aria-labelledby="title desc"><title id="title">Q1 — Quality attribute map</title><desc id="desc">Product quality and system quality are complementary, not interchangeable.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="375" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="23" y="32" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Q1 — Quality attribute map</text><text x="23" y="56" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Product quality and system quality are complementary, not interchangeable.</text><rect x="23" y="88" width="296" height="92" rx="8" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-width="1.3"/><text x="171.0" y="113" font-size="17" font-weight="700" text-anchor="middle" fill="#2563eb">Content quality</text><text x="171.0" y="134" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Correctness · suitability</text><text x="171.0" y="152" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Independent subject review</text><rect x="332" y="88" width="296" height="92" rx="8" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-width="1.3"/><text x="480.0" y="113" font-size="17" font-weight="700" text-anchor="middle" fill="#7c3aed">Presentation quality</text><text x="480.0" y="134" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Readability · typography · layout</text><text x="480.0" y="152" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Math notation · figures · pagination</text><rect x="641" y="88" width="296" height="92" rx="8" fill="#0d9488" fill-opacity="0.07" stroke="#0d9488" stroke-width="1.3"/><text x="789.0" y="113" font-size="17" font-weight="700" text-anchor="middle" fill="#0d9488">Deliverable integrity</text><text x="789.0" y="134" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Item/key parity · actual export</text><text x="789.0" y="152" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Complete, approved artifact set</text><text x="480" y="213" font-size="15" font-weight="700" text-anchor="middle" fill="#475569">QUALITY OF THE SYSTEM THAT PRODUCES THE DELIVERABLES</text><rect x="23" y="230" width="176" height="76" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="111.0" y="255" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Reliability</text><text x="111.0" y="276" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Recover or block</text><rect x="207" y="230" width="176" height="76" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="295.0" y="255" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Performance</text><text x="295.0" y="276" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Time and resources</text><rect x="391" y="230" width="176" height="76" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="479.0" y="255" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Maintainability</text><text x="479.0" y="276" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Reusable + testable</text><rect x="575" y="230" width="176" height="76" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="663.0" y="255" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Portability</text><text x="663.0" y="276" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Cross-harness</text><rect x="759" y="230" width="176" height="76" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="847.0" y="255" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Auditability</text><text x="847.0" y="276" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Traceable evidence</text><text x="480" y="337" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">Review both the educational content and the actual rendered artifact; no new numerical targets assumed.</text><text x="23" y="361" font-size="12" font-weight="400" text-anchor="start" fill="#64748b">MTS • Level 1 Conceptual Foundation • Canonical draft, revision 2</text></g></svg>
