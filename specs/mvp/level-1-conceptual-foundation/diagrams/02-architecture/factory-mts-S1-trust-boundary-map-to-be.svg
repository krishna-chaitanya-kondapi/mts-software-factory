<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc"><title id="title">S1 — Trust boundaries and security posture</title><desc id="desc">Control data ingress, execution, storage, public disclosure and release.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="530" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="23" y="32" font-size="25" font-weight="700" text-anchor="start" fill="#172033">S1 — Trust boundaries and security posture</text><text x="23" y="56" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Control data ingress, execution, storage, public disclosure and release.</text><rect x="310" y="81" width="340" height="303" rx="8" fill="#2563eb" fill-opacity="0.035" stroke="#2563eb" stroke-width="1.3"/><text x="480" y="103" font-size="15" font-weight="700" text-anchor="middle" fill="#2563eb">GOVERNED MTS BOUNDARY</text><rect x="330" y="120" width="300" height="75" rx="8" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-width="1.3"/><text x="480.0" y="145" font-size="17" font-weight="700" text-anchor="middle" fill="#2563eb">Execution &amp; context</text><text x="480.0" y="166" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Least necessary permitted data</text><rect x="330" y="222" width="300" height="75" rx="8" fill="#0d9488" fill-opacity="0.07" stroke="#0d9488" stroke-width="1.3"/><text x="480.0" y="247" font-size="17" font-weight="700" text-anchor="middle" fill="#0d9488">Artifact production</text><text x="480.0" y="268" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Sanitized content · safe rendering</text><path d="M480 195V222" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><rect x="330" y="312" width="300" height="54" rx="8" fill="#a16207" fill-opacity="0.07" stroke="#a16207" stroke-width="1.3"/><text x="480.0" y="337" font-size="16" font-weight="700" text-anchor="middle" fill="#a16207">Release gate</text><text x="480.0" y="358" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Revision-bound human approval</text><path d="M480 297V312" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><rect x="23" y="120" width="245" height="64" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="145.5" y="145" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">External sources</text><text x="145.5" y="166" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Treat as untrusted data</text><rect x="23" y="248" width="245" height="64" rx="8" fill="#a16207" fill-opacity="0.07" stroke="#a16207" stroke-width="1.3"/><text x="145.5" y="273" font-size="16" font-weight="700" text-anchor="middle" fill="#a16207">Authorized human</text><text x="145.5" y="294" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Owns release decisions</text><rect x="692" y="120" width="245" height="64" rx="8" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-width="1.3"/><text x="814.5" y="145" font-size="16" font-weight="700" text-anchor="middle" fill="#7c3aed">AI provider</text><text x="814.5" y="166" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Minimum permitted context</text><rect x="692" y="221" width="245" height="64" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="814.5" y="246" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Restricted storage</text><text x="814.5" y="267" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Scoped access · no secrets in Git</text><rect x="692" y="319" width="245" height="64" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="814.5" y="344" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Public GitHub</text><text x="814.5" y="365" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Sanitized specs only</text><path d="M268 152H330" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><path d="M630 152H692" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><path d="M268 280H290V339H330" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><path d="M630 253H692" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><path d="M630 339H692" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><path d="M480 366V405" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><rect x="303" y="406" width="354" height="65" rx="8" fill="#0d9488" fill-opacity="0.07" stroke="#0d9488" stroke-width="1.3"/><text x="480.0" y="431" font-size="17" font-weight="700" text-anchor="middle" fill="#0d9488">Approved output / PrintReady</text><text x="480.0" y="452" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Confirm destination and artifact revision</text><text x="480" y="493" font-size="13" font-weight="400" text-anchor="middle" fill="#475569">Proposed controls; actual permissions, injection protections and release enforcement not fully audited.</text><text x="23" y="516" font-size="12" font-weight="400" text-anchor="start" fill="#64748b">MTS • Level 1 Conceptual Foundation • Canonical draft, revision 2</text></g></svg>
