0" text-anchor="middle" fill="#475569">FA-04-MAT owns composition and rendering; FA-05-QLT verifies; FA-06-REL manages authorized delivery.</text><text x="23" y="311" font-size="12" font-weight="400" text-anchor="start" fill="#64748b">MTS • Level 1 Conceptual Foundation • Canonical draft, revision 2</text></g></svg>
