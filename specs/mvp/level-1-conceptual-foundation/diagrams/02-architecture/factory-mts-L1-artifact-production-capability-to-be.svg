<svg xmlns="http://www.w3.org/2000/svg" width="960" height="325" viewBox="0 0 960 325" role="img" aria-labelledby="title desc"><title id="title">L1 — Educational artifact production capability</title><desc id="desc">Content correctness and publication-ready presentation are separate responsibilities.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="325" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="23" y="32" font-size="25" font-weight="700" text-anchor="start" fill="#172033">L1 — Educational artifact production capability</text><text x="23" y="56" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Content correctness and publication-ready presentation are separate responsibilities.</text><rect x="12" y="100" width="174" height="100" rx="8" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-width="1.3"/><text x="99.0" y="125" font-size="14" font-weight="700" text-anchor="middle" fill="#7c3aed">Content</text><text x="99.0" y="146" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Questions · passages</text><text x="99.0" y="164" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Answers · explanations</text><path d="M186 150H200" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><rect x="200" y="100" width="174" height="100" rx="8" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-width="1.3"/><text x="287.0" y="125" font-size="14" font-weight="700" text-anchor="middle" fill="#2563eb">Composition</text><text x="287.0" y="146" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Structure · sequencing</text><text x="287.0" y="164" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Templates · asset placement</text><path d="M374 150H388" fill="none" stroke="#64748b" stroke-width="1.6"  marker-e