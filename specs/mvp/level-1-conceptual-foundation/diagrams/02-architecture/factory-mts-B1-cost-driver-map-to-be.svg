<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-labelledby="title desc"><title id="title">B1 — Cost and resource drivers</title><desc id="desc">Budget and resource boundaries must be agreed; the prior run lacks full actuals.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="490" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="23" y="32" font-size="25" font-weight="700" text-anchor="start" fill="#172033">B1 — Cost and resource drivers</text><text x="23" y="56" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Budget and resource boundaries must be agreed; the prior run lacks full actuals.</text><rect x="23" y="85" width="296" height="69" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="171.0" y="110" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">AI &amp; retrieval</text><text x="171.0" y="131" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Research · generation</text><rect x="332" y="85" width="296" height="69" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="480.0" y="110" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Verification</text><text x="480.0" y="131" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Independent evaluation</text><rect x="641" y="85" width="296" height="69" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="789.0" y="110" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Composition &amp; rendering</text><text x="789.0" y="131" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Templates · exports · retries</text><rect x="23" y="168" width="296" height="69" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="171.0" y="193" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Human involvement</text><text x="171.0" y="214" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Active review · wait</text><rect x="332" y="168" width="296" height="69" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="480.0" y="193" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Compute &amp; storage</text><text x="480.0" y="214" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Execution · persistence</text><rect x="641" y="168" width="296" height="69" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="789.0" y="193" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Delivery &amp; rework</text><text x="789.0" y="214" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Publication · extra attempts</text><path d="M480 237V256" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><rect x="220" y="256" width="520" height="88" rx="8" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-width="1.3"/><text x="480.0" y="281" font-size="17" font-weight="700" text-anchor="middle" fill="#2563eb">Production run</text><text x="480.0" y="302" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Estimated vs actual resource consumption</text><text x="480.0" y="320" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Time · tokens / charges where available · attempts</text><path d="M480 344V362" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><rect x="220" y="362" width="520" height="70" rx="8" fill="#0d9488" fill-opacity="0.07" stroke="#0d9488" stroke-width="1.3"/><text x="480.0" y="387" font-size="17" font-weight="700" text-anchor="middle" fill="#0d9488">Accepted deliverables</text><text x="480.0" y="408" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Attributable cost per accepted deliverable, when known</text><text x="480" y="453" font-size="13" font-weight="400" text-anchor="middle" fill="#475569">Missing measurements stay unknown; human waiting is reported separately from active work.</text><text x="23" y="476" font-size="12" font-weight="400" text-anchor="start" fill="#64748b">MTS • Level 1 Conceptual Foundation • Canonical draft, revision 2</text></g></svg>
