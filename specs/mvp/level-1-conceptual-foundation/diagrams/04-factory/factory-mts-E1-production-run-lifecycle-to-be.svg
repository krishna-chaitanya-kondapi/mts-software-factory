<svg xmlns="http://www.w3.org/2000/svg" width="960" height="545" viewBox="0 0 960 545" role="img" aria-labelledby="title desc"><title id="title">E1 — Production Run Lifecycle</title><desc id="desc">PreRun → Run → PostRun; separate phase completion conditions.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="545" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">E1 — Production Run Lifecycle</text><text x="24" y="55" font-size="13" font-weight="400" fill="#475569" text-anchor="start">PreRun → Run → PostRun; separate phase completion conditions.</text><rect x="8" y="78" width="304" height="292" rx="7" fill="#2563eb" fill-opacity="0.035" stroke="#2563eb"/><text x="160" y="104" font-size="19" font-weight="700" fill="#2563eb" text-anchor="middle">01 — PreRun</text><rect x="22" y="118" width="276" height="29" rx="7" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb"/><text x="160" y="137" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Resolve intent &amp; context</text><rect x="22" y="155" width="276" height="29" rx="7" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb"/><text x="160" y="174" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Prepare execution plan</text><rect x="22" y="192" width="276" height="29" rx="7" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb"/><text x="160" y="211" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Establish applicable DoD</text><rect x="22" y="229" width="276" height="29" rx="7" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb"/><text x="160" y="248" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Preflight checks</text><rect x="22" y="266" width="276" height="29" rx="7" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb"/><text x="160" y="285" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Approve RunSpec</text><rect x="22" y="307" width="276" height="45" rx="7" fill="#2563eb" fill-opacity="0.13" stroke="#2563eb"/><text x="160" y="335" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">Approved RunSpec</text><rect x="8" y="382" width="304" height="63" rx="7" fill="#475569" fill-opacity="0.06" stroke="#475569"/><text x="160.0" y="406" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">01-PreRun/YYYY-MM-DD/</text><text x="160.0" y="427" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">RunSpec PDF + JSON</text><path d="M312 220H328" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="328" y="78" width="304" height="292" rx="7" fill="#7c3aed" fill-opacity="0.035" stroke="#7c3aed"/><text x="480" y="104" font-size="19" font-weight="700" fill="#7c3aed" text-anchor="middle">02 — Run</text><rect x="342" y="118" width="276" height="29" rx="7" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed"/><text x="480" y="137" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Generate content</text><rect x="342" y="155" width="276" height="29" rx="7" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed"/><text x="480" y="174" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Independently verify content</text><rect x="342" y="192" width="276" height="29" rx="7" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed"/><text x="480" y="211" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Compose &amp; present</text><rect x="342" y="229" width="276" height="29" rx="7" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed"/><text x="480" y="248" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Render actual deliverables</text><rect x="342" y="266" width="276" height="29" rx="7" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed"/><text x="480" y="285" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Inspect, repair &amp; reverify</text><rect x="342" y="307" width="276" height="45" rx="7" fill="#7c3aed" fill-opacity="0.13" stroke="#7c3aed"/><text x="480" y="335" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">Verified release candidate</text><rect x="328" y="382" width="304" height="63" rx="7" fill="#475569" fill-opacity="0.06" stroke="#475569"/><text x="480.0" y="406" font-size="13" font-weight="700" fill="#475569" text-anchor="middle">02-Run/YYYY-MM-DD/</text><text x="480.0" y="427" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Student &amp; teacher artifacts</text><path d="M632 220H648" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="648" y="78" width="304" height="292" rx="7" fill="#0d9488" fill-opacity="0.035" stroke="#0d9488"/><text x="800" y="104" font-size="19" font-weight="700" fill="#0d9488" text-anchor="middle">03 — PostRun</text><rect x="662" y="118" width="276" height="29" rx="7" fill="#0d9488" fill-opacity="0.07" stroke="#0d9488"/><text x="800" y="137" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Human release approval</text><rect x="662" y="155" width="276" height="29" rx="7" fill="#0d9488" fill-opacity="0.07" stroke="#0d9488"/><text x="800" y="174" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Publish approved artifacts</text><rect x="662" y="192" width="276" height="29" rx="7" fill="#0d9488" fill-opacity="0.07" stroke="#0d9488"/><text x="800" y="211" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Reconcile publication</text><rect x="662" y="229" width="276" height="29" rx="7" fill="#0d9488" fill-opacity="0.07" stroke="#0d9488"/><text x="800" y="248" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Persist QA &amp; RunLog</text><rect x="662" y="266" width="276" height="29" rx="7" fill="#0d9488"