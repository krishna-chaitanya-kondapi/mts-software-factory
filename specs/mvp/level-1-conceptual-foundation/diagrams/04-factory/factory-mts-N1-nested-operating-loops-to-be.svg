<svg xmlns="http://www.w3.org/2000/svg" width="960" height="615" viewBox="0 0 960 615" role="img" aria-labelledby="title desc"><title id="title">N1 — Nested operating loops</title><desc id="desc">Separate artifact correction, production execution, workflow evolution and factory improvement.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="615" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">N1 — Nested operating loops</text><text x="24" y="55" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Separate artifact correction, production execution, workflow evolution and factory improvement.</text><rect x="12" y="76" width="936" height="510" rx="7" fill="#2563eb" fill-opacity="0.025" stroke="#2563eb"/><text x="31" y="100" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">Factory improvement loop</text><text x="31" y="120" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Build capabilities → Verify → Learn → Evolve</text><rect x="47" y="139" width="866" height="382" rx="7" fill="#7c3aed" fill-opacity="0.035" stroke="#7c3aed"/><text x="66" y="163" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start">Workflow improvement loop</text><text x="66" y="183" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Design → Exercise through production → Evaluate → Refine</text><rect x="83" y="200" width="794" height="244" rx="7" fill="#0d9488" fill-opacity="0.04" stroke="#0d9488"/><text x="102" y="225" font-size="17" font-weight="700" fill="#0d9488" text-anchor="start">Production run loop</text><rect x="105" y="240" width="230" height="41" rx="7" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488"/><text x="220" y="266" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">PreRun</text><path d="M335 260H365" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="365" y="240" width="230" height="41" rx="7" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488"/><text x="480" y="266" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">Run</text><path d="M595 260H625" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="625" y="240" width="230" height="41" rx="7" fill="#0d9488" fill-opacity="0.1" stroke="#0d9488"/><text x="740" y="266" font-size="16" font-weight="700" fill="#172033" text-anchor="middle">PostRun</text><rect x="298" y="299" width="364" height="103" rx="7" fill="#a16207" fill-opacity="0.06" stroke="#a16207"/><text x="480" y="319" font-size="14" font-weight="700" fill="#a16207" text-anchor="middle">Inner convergence loop</text><rect x="310" y="332" width="101" height="29" rx="7" fill="#a16207" fill-opacity="0.08" stroke="#a16207"/><text x="360" y="351" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Generate</text><path d="M411 346H430" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="430" y="332" width="101" height="29" rx="7" fill="#a16207" fill-opacity="0.08" stroke="#a16207"/><text x="480" y="351" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Verify</text><path d="M531 346H550" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="550" y="332" width="101" height="29" rx="7" fill="#a16207" fill-opacity="0.08" stroke="#a16207"/><text x="600" y="351" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Repair</text><path d="M600 361V375H360V361" stroke="#a16207" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><text x="480" y="394" font-size="12" font-weight="400" fill="#a16207" text-anchor="middle">Bounded by DoD and budget</text><path d="M740 281V414H220V281" stroke="#0d9488" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><text x="480" y="435" font-size="12" font-weight="400" fill="#0d9488" text-anchor="middle">Run evidence informs the next production run</text><path d="M877 444V475H83V444" stroke="#7c3aed" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><text x="480" y="500" font-size="13" font-weight="400" fill="#7c3aed" text-anchor="middle">Recurring defects drive workflow improvements</text><path d="M913 521V544H47V521" stroke="#2563eb" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><text x="480" y="569" font-size="13" font-weight="400" fill="#2563eb" text-anchor="middle">Reusable improvements become factory capabilities</text><text x="24" y="602" font-size="12" font-weight="400" fill="#475569" text-anchor="start">MTS • Level 1 Conceptual Foundation • Factory review candidate, revision 1</text></g></svg>
