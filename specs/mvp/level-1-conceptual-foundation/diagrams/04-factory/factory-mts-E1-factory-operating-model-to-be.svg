<svg xmlns="http://www.w3.org/2000/svg" width="960" height="650" viewBox="0 0 960 650" role="img" aria-labelledby="title desc"><title id="title">Holistic Software Factory operating model</title><desc id="desc">Three engineering scopes; development and educational production are distinct.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="650" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Holistic Software Factory operating model</text><text x="24" y="55" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Three engineering scopes; development and educational production are distinct.</text><rect x="180" y="76" width="600" height="60" rx="7" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb"/><text x="480.0" y="100" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Human intent &amp; educational outcomes</text><text x="480.0" y="121" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Product · Business architecture · Ontology · Requirements &amp; verification</text><path d="M480 136V157" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="25" y="158" width="910" height="95" rx="7" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb"/><text x="42" y="183" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">Factory Engineering</text><text x="42" y="202" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Build and evolve reusable capabilities</text><rect x="42" y="212" width="284" height="29" rx="7" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb"/><text x="184" y="231" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">Intent &amp; architecture</text><rect x="338" y="212" width="284" height="29" rx="7" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb"/><text x="480" y="231" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">M0–M8 engineering</text><rect x="634" y="212" width="284" height="29" rx="7" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb"/><text x="776" y="231" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">Reusable services</text><path d="M480 253V271" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="25" y="271" width="910" height="95" rx="7" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed"/><text x="42" y="296" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start">Workflow Engineering</text><text x="42" y="315" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Design repeatable educational workflows</text><rect x="42" y="325" width="284" height="29" rx="7" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed"/><text x="184" y="344" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">Weekly Practice</text><rect x="338" y="325" width="284" height="29" rx="7" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed"/><text x="480" y="344" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">Mock Assessments</text><rect x="634" y="325" width="284" height="29" rx="7" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed"/><text x="776" y="344" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">Topic Mastery</text><path d="M480 366V384" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="25" y="384" width="910" height="95" rx="7" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488"/><text x="42" y="409" font-size="18" font-weight="700" fill="#0d9488" text-anchor="start">Production Run Engineering</text><text x="42" y="428" font-size="13" font-weight="400" fill="#172033" text-anchor="start">Execute a particular approved scope</text><rect x="42" y="438" width="284" height="29" rx="7" fill="#0d9488" fill-opacity="0.09" stroke="#0d9488"/><text x="184" y="457" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">PreRun</text><rect x="338" y="438" width="284" height="29" rx="7" fill="#0d9488" fill-opacity="0.09" stroke="#0d9488"/><text x="480" y="457" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">Run</text><rect x="634" y="438" width="284" height="29" rx="7" fill="#0d9488" fill-opacity="0.09" stroke="#0d9488"/><text x="776" y="457" font-size="13" font-weight="700" fill="#172033" text-anchor="middle">PostRun</text><text x="480" y="500" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">Shared knowledge · Harness · Verification · Rendering · Convergence · Observability</text><path d="M480 510V531" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="180" y="532" width="600" height="61" rx="7" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488"/><text x="480.0" y="556" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">Approved educational deliverables</text><text x="480.0" y="577" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Worksheets · Assessments · Keys · Cheatsheets · Guides</text><path d="M780 563H950V106H780" stroke="#0d9488" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="480" y="620" font-size="14" font-weight="700" fill="#0d9488" text-anchor="middle">Operational evidence and learning inform continuous improvement</text><text x="24" y="637" font-size="12" font-weight="400" fill="#475569" text-anchor="start">MTS • Level 1 Conceptual Foundation • Factory review candidate, revision 1</text></g></svg>
