<svg xmlns="http://www.w3.org/2000/svg" width="960" height="515" viewBox="0 0 960 515" role="img" aria-labelledby="title desc"><title id="title">N1 — Convergence and escalation</title><desc id="desc">Stable intent and criteria; repair actual state, not silently move the target.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="515" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">N1 — Convergence and escalation</text><text x="24" y="55" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Stable intent and criteria; repair actual state, not silently move the target.</text><rect x="100" y="77" width="340" height="62" rx="7" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb"/><text x="270.0" y="101" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Desired state</text><text x="270.0" y="122" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Approved intent &amp; DoD</text><rect x="520" y="77" width="340" height="62" rx="7" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed"/><text x="690.0" y="101" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">Actual state</text><text x="690.0" y="122" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Generated artifact &amp; evidence</text><path d="M270 139V158H480V176" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><path d="M690 139V158H480" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="280" y="177" width="400" height="60" rx="7" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488"/><text x="480.0" y="201" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">Independent verification</text><text x="480.0" y="222" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Measure the gap</text><path d="M480 237V255" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><path d="M480 255L590 296L480 337L370 296Z" fill="#a16207" fill-opacity=".08" stroke="#a16207"/><text x="480" y="291" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">DoD met?</text><text x="480" y="309" font-size="12" font-weight="400" fill="#172033" text-anchor="middle">Evidence sufficient?</text><path d="M590 296H720" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><text x="650" y="288" font-size="12" font-weight="400" fill="#0d9488" text-anchor="middle">Yes</text><rect x="721" y="265" width="228" height="62" rx="7" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488"/><text x="835.0" y="289" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle">Next authorized gate</text><text x="835.0" y="310" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Completion candidate</text><path d="M370 296H240V355" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><text x="306" y="287" font-size="12" font-weight="400" fill="#a16207" text-anchor="middle">No</text><rect x="30" y="356" width="900" height="105" rx="7" fill="#a16207" fill-opacity="0.035" stroke="#a16207"/><rect x="42" y="370" width="278" height="76" rx="7" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488"/><text x="181.0" y="394" font-size="15" font-weight="700" fill="#0d9488" text-anchor="middle">Execution gap</text><text x="181.0" y="415" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Repair implementation</text><text x="181.0" y="433" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Within approved intent</text><rect x="341" y="370" width="278" height="76" rx="7" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed"/><text x="480.0" y="394" font-size="15" font-weight="700" fill="#7c3aed" text-anchor="middle">Specification gap</text><text x="480.0" y="415" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Clarify or revise contract</text><text x="480.0" y="433" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Approval as required</text><rect x="640" y="370" width="278" height="76" rx="7" fill="#a16207" fill-opacity="0.06" stroke="#a16207"/><text x="779.0" y="394" font-size="15" font-weight="700" fill="#a16207" text-anchor="middle">Intent / authority gap</text><text x="779.0" y="415" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Stop and escalate</text><text x="779.0" y="433" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Human decision required</text><path d="M42 408H12V207H280" stroke="#0d9488" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><text x="480" y="484" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Stop when budgets are exhausted, progress ceases, or required authority is unavailable.</text><text x="24" y="502" font-size="12" font-weight="400" fill="#475569" text-anchor="start">MTS • Level 1 Conceptual Foundation • Factory review candidate, revision 1</text></g></svg>
