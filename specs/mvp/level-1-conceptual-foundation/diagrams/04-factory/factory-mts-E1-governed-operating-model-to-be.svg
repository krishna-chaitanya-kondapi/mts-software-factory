<svg xmlns="http://www.w3.org/2000/svg" width="960" height="805" viewBox="0 0 960 805" role="img" aria-labelledby="title desc"><title id="title">Governed Factory operating model</title><desc id="desc">Resolve the contract, enforce constraints, verify outcomes and learn.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="805" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Governed Factory operating model</text><text x="24" y="55" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Resolve the contract, enforce constraints, verify outcomes and learn.</text><rect x="180" y="76" width="600" height="60" rx="7" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb"/><text x="480.0" y="100" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Human intent &amp; desired outcomes</text><text x="480.0" y="121" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Intent Quartet</text><path d="M480 136V154" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="20" y="155" width="920" height="155" rx="7" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed"/><text x="480" y="179" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="middle">K1 — Knowledge &amp; Context Engineering</text><rect x="34" y="193" width="217" height="62" rx="7" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed"/><text x="142.5" y="217" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">Knowledge</text><text x="142.5" y="238" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Relevant understanding</text><rect x="259" y="193" width="217" height="62" rx="7" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed"/><text x="367.5" y="217" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">Policy</text><text x="367.5" y="238" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Rules &amp; boundaries</text><rect x="484" y="193" width="217" height="62" rx="7" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed"/><text x="592.5" y="217" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">Configuration</text><text x="592.5" y="238" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Operating parameters</text><rect x="709" y="193" width="217" height="62" rx="7" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed"/><text x="817.5" y="217" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">Guardrails</text><text x="817.5" y="238" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Required controls</text><rect x="170" y="268" width="620" height="29" rx="7" fill="#7c3aed" fill-opacity="0.1" stroke="#7c3aed"/><text x="480" y="287" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">Resolve applicability, precedence, conflicts and exceptions</text><path d="M480 310V330" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="180" y="331" width="600" height="63" rx="7" fill="#a16207" fill-opacity="0.06" stroke="#a16207"/><text x="480.0" y="355" font-size="17" font-weight="700" fill="#a16207" text-anchor="middle">Approved execution contract</text><text x="480.0" y="376" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">RunSpec · Effective configuration · DoD · Applicable controls</text><path d="M480 394V413" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="20" y="414" width="920" height="143" rx="7" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb"/><text x="480" y="438" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">E1 — Harness &amp; Execution Engineering</text><rect x="34" y="449" width="292" height="60" rx="7" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed"/><text x="180.0" y="473" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">AI</text><text x="180.0" y="494" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Reason &amp; generate</text><rect x="334" y="449" width="292" height="60" rx="7" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb"/><text x="480.0" y="473" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Harness</text><text x="480.0" y="494" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Coordinate &amp; enforce</text><rect x="634" y="449" width="292" height="60" rx="7" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488"/><text x="780.0" y="473" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">Code &amp; tools</text><text x="780.0" y="494" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Execute &amp; verify</text><rect x="145" y="519" width="670" height="27" rx="7" fill="#a16207" fill-opacity="0.06" stroke="#a16207"/><text x="480" y="537" font-size="13" font-weight="700" fill="#a16207" text-anchor="middle">Guardrail enforcement · Permissions · Checks · Gates · Limits</text><path d="M480 557V574H245V590" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="20" y="591" width="440" height="65" rx="7" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488"/><text x="240.0" y="615" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">V1 — Verification &amp; Evaluation</text><text x="240.0" y="636" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Measure conformance to intent and rules</text><rect x="500" y="591" width="440" height="65" rx="7" fill="#a16207" fill-opacity="0.06" stroke="#a16207"/><text x="720.0" y="615" font-size="17" font-weight="700" fill="#a16207" text-anchor="middle">N1 — Loop &amp; Convergence</text><text x="720.0" y="636" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Repair within authorized boundaries</text><path d="M460 623H500" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><path d="M940 623H951V480H940" stroke="#a16207" stroke-width="1.6" fill="none" stroke-dasharray="5 4" marker-end="url(#a)"/><path d="M240 656V675H480M720 656V675H480V691" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="20" y="692" width="920" height="60" rx="7" fill="#475569" fill-opacity="0.06" stroke="#475569"/><text x="480.0" y="716" font-size="17" font-weight="700" fill="#475569" text-anchor="middle">O1 — Observability &amp; Learning</text><text x="480.0" y="737" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Evidence · Deliverables · Guardrail events · Defects · Governed improvements</text><text x="480" y="776" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Governance, security and reviewability apply across the whole model.</text><text x="24" y="792" font-size="12" font-weight="400" fill="#475569" text-anchor="start">MTS • Level 1 Conceptual Foundation • Factory review candidate, revision 1</text></g></svg>
