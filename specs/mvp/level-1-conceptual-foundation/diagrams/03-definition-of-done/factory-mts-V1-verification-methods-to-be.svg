<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc"><title id="title">V1 — Verification methods</title><desc id="desc">Select the method or combination appropriate to the requirement before execution.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="340" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">V1 — Verification methods</text><text x="24" y="55" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Select the method or combination appropriate to the requirement before execution.</text><rect x="24" y="78" width="450" height="110" rx="7" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb"/><text x="249" y="103" font-size="18" font-weight="700" fill="#2563eb" text-anchor="middle">Deterministic verification</text><text x="249" y="126" font-size="14" font-weight="400" fill="#172033" text-anchor="middle">Can correctness be computed?</text><text x="249" y="150" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">Math answers · Counts</text><text x="249" y="167" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">File hashes · Page limits</text><rect x="486" y="78" width="450" height="110" rx="7" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed"/><text x="711" y="103" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="middle">AI evaluation</text><text x="711" y="126" font-size="14" font-weight="400" fill="#172033" text-anchor="middle">Does content satisfy a semantic rubric?</text><text x="711" y="150" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">ELA interpretation · Reasoning</text><text x="711" y="167" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">Distractor quality</text><rect x="24" y="200" width="450" height="110" rx="7" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488"/><text x="249" y="225" font-size="18" font-weight="700" fill="#0d9488" text-anchor="middle">Visual inspection</text><text x="249" y="248" font-size="14" font-weight="400" fill="#172033" text-anchor="middle">Is the actual presentation acceptable?</text><text x="249" y="272" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">Readability · Typography</text><text x="249" y="289" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">Notation · Diagrams · Layout</text><rect x="486" y="200" width="450" height="110" rx="7" fill="#a16207" fill-opacity="0.08" stroke="#a16207"/><text x="711" y="225" font-size="18" font-weight="700" fill="#a16207" text-anchor="middle">Human judgment</text><text x="711" y="248" font-size="14" font-weight="400" fill="#172033" text-anchor="middle">Does it satisfy the intended need?</text><text x="711" y="272" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">Pedagogical suitability</text><text x="711" y="289" font-size="13" font-weight="400" fill="#64748b" text-anchor="middle">Exceptions · Approval</text><text x="24" y="326" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">MTS • Level 1 Conceptual Foundation • Canonical review draft, revision 1</text></g></svg>
