<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc"><title id="title">V1 — Completion scopes</title><desc id="desc">Deliverables are subordinate review subjects; a single pass does not verify the whole factory.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="500" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">V1 — Completion scopes</text><text x="24" y="55" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Deliverables are subordinate review subjects; a single pass does not verify the whole factory.</text><rect x="22" y="75" width="916" height="390" rx="7" fill="#2563eb" fill-opacity="0.035" stroke="#2563eb"/><text x="38" y="100" font-size="18" font-weight="700" fill="#2563eb" text-anchor="start">Factory DoD</text><text x="38" y="122" font-size="14" font-weight="400" fill="#172033" text-anchor="start">Does the reusable engineering capability work?</text><rect x="64" y="152" width="832" height="297" rx="7" fill="#7c3aed" fill-opacity="0.035" stroke="#7c3aed"/><text x="80" y="177" font-size="18" font-weight="700" fill="#7c3aed" text-anchor="start">Workflow DoD</text><text x="80" y="199" font-size="14" font-weight="400" fill="#172033" text-anchor="start">Can the repeatable end-to-end process satisfy its contract?</text><rect x="106" y="229" width="748" height="204" rx="7" fill="#0d9488" fill-opacity="0.035" stroke="#0d9488"/><text x="122" y="254" font-size="18" font-weight="700" fill="#0d9488" text-anchor="start">Production Run DoD</text><text x="122" y="276" font-size="14" font-weight="400" fill="#172033" text-anchor="start">Did this particular execution satisfy its approved RunSpec?</text><rect x="148" y="306" width="664" height="111" rx="7" fill="#475569" fill-opacity="0.035" stroke="#475569"/><text x="164" y="331" font-size="18" font-weight="700" fill="#475569" text-anchor="start">Deliverable DoD</text><text x="164" y="353" font-size="14" font-weight="400" fill="#172033" text-anchor="start">Does this artifact satisfy all applicable requirements?</text><text x="480" y="390" font-size="14" font-weight="700" fill="#172033" text-anchor="middle">Content · Presentation · Rendered output · Evidence</text><text x="24" y="486" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">MTS • Level 1 Conceptual Foundation • Canonical review draft, revision 1</text></g></svg>
