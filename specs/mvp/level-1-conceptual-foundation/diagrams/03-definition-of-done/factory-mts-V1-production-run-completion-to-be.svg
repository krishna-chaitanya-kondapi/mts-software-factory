<svg xmlns="http://www.w3.org/2000/svg" width="960" height="425" viewBox="0 0 960 425" role="img" aria-labelledby="title desc"><title id="title">V1 — Production run completion</title><desc id="desc">Phase contracts preserve applicable subject-specific checkpoints.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="425" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">V1 — Production run completion</text><text x="24" y="55" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Phase contracts preserve applicable subject-specific checkpoints.</text><rect x="15" y="78" width="300" height="255" rx="7" fill="#2563eb" fill-opacity="0.035" stroke="#2563eb"/><rect x="15" y="78" width="300" height="40" rx="7" fill="#2563eb" fill-opacity="1" stroke="#2563eb"/><text x="165" y="104" font-size="18" font-weight="700" fill="white" text-anchor="middle">01 — PreRun</text><rect x="27" y="130" width="276" height="30" rx="7" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb"/><text x="165" y="150" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Resolve intent and curriculum</text><rect x="27" y="167" width="276" height="30" rx="7" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb"/><text x="165" y="187" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Pin inputs and source selections</text><rect x="27" y="204" width="276" height="30" rx="7" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb"/><text x="165" y="224" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Define applicable DoD</text><rect x="27" y="241" width="276" height="30" rx="7" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb"/><text x="165" y="261" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Approve scope and RunSpec</text><rect x="27" y="284" width="276" height="36" rx="7" fill="#2563eb" fill-opacity="0.14" stroke="#2563eb"/><text x="165" y="306" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">Approved execution contract</text><path d="M315 200H330" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><rect x="330" y="78" width="300" height="255" rx="7" fill="#7c3aed" fill-opacity="0.035" stroke="#7c3aed"/><rect x="330" y="78" width="300" height="40" rx="7" fill="#7c3aed" fill-opacity="1" stroke="#7c3aed"/><text x="480" y="104" font-size="18" font-weight="700" fill="white" text-anchor="middle">02 — Run</text><rect x="342" y="130" width="276" height="30" rx="7" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed"/><text x="480" y="150" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Generate and verify content</text><rect x="342" y="167" width="276" height="30" rx="7" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed"/><text x="480" y="187" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Compose and render artifacts</text><rect x="342" y="204" width="276" height="30" rx="7" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed"/><text x="480" y="224" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Inspect actual deliverables</text><rect x="342" y="241" width="276" height="30" rx="7" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed"/><text x="480" y="261" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Repair and reverify</text><rect x="342" y="284" width="276" height="36" rx="7" fill="#7c3aed" fill-opacity="0.14" stroke="#7c3aed"/><text x="480" y="306" font-size="13" font-weight="700" fill="#7c3aed" text-anchor="middle">Verified release candidate</text><path d="M630 200H645" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><rect x="645" y="78" width="300" height="255" rx="7" fill="#0d9488" fill-opacity="0.035" stroke="#0d9488"/><rect x="645" y="78" width="300" height="40" rx="7" fill="#0d9488" fill-opacity="1" stroke="#0d9488"/><text x="795" y="104" font-size="18" font-weight="700" fill="white" text-anchor="middle">03 — PostRun</text><rect x="657" y="130" width="276" height="30" rx="7" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488"/><text x="795" y="150" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Human release authorization</text><rect x="657" y="167" width="276" height="30" rx="7" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488"/><text x="795" y="187" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Publish and reconcile</text><rect x="657" y="204" width="276" height="30" rx="7" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488"/><text x="795" y="224" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Persist evidence and RunLog</text><rect x="657" y="241" width="276" height="30" rx="7" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488"/><text x="795" y="261" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Capture learning and defects</text><rect x="657" y="284" width="276" height="36" rx="7" fill="#0d9488" fill-opacity="0.14" stroke="#0d9488"/><text x="795" y="306" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">Completed production run</text><path d="M480 333V355H165V333" fill="none" stroke="#a16207" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="325" y="350" font-size="12" font-weight="400" fill="#a16207" text-anchor="middle">Reapprove if intent or scope changes</text><path d="M795 333V390H165V333" fill="none" stroke="#0d9488" stroke-width="1.6" marker-end="url(#a)"/><text x="480" y="383" font-size="13" font-weight="700" fill="#0d9488" text-anchor="middle">Continuous learning informs the next run</text><text x="24" y="411" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">MTS • Level 1 Conceptual Foundation • Canonica