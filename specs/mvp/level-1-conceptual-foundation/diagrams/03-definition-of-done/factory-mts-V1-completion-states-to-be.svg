<svg xmlns="http://www.w3.org/2000/svg" width="960" height="425" viewBox="0 0 960 425" role="img" aria-labelledby="title desc"><title id="title">V1 — Completion states</title><desc id="desc">Verification, authorization and delivery are distinct; approval is not a verification pass.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="425" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">V1 — Completion states</text><text x="24" y="55" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Verification, authorization and delivery are distinct; approval is not a verification pass.</text><rect x="225" y="75" width="510" height="63" rx="7" fill="#475569" fill-opacity="0.08" stroke="#475569"/><text x="480.0" y="100" font-size="17" font-weight="700" fill="#475569" text-anchor="middle">Generated</text><text x="480.0" y="120" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Candidate artifact exists</text><path d="M480 138V159" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><rect x="225" y="159" width="510" height="63" rx="7" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb"/><text x="480.0" y="184" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Verified</text><text x="480.0" y="204" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Applicable completion criteria satisfied</text><path d="M480 222V243" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><rect x="225" y="243" width="510" height="63" rx="7" fill="#a16207" fill-opacity="0.08" stroke="#a16207"/><text x="480.0" y="268" font-size="17" font-weight="700" fill="#a16207" text-anchor="middle">Approved</text><text x="480.0" y="288" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Human authorizes the exact revision</text><path d="M480 306V327" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><rect x="225" y="327" width="510" height="63" rx="7" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488"/><text x="480.0" y="352" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">Released &amp; reconciled</text><text x="480.0" y="372" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Confirmed delivery of the approved artifact</text><text x="24" y="411" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">MTS • Level 1 Conceptual Foundation • Canonical review draft, revision 1</text></g></svg>
