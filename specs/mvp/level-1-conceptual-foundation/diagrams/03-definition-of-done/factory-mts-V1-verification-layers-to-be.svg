00" fill="#0d9488" text-anchor="start">Rendered Deliverable</text><text x="96" y="445" font-size="14" font-weight="400" fill="#172033" text-anchor="start">Is the actual output correct and usable?</text><text x="96" y="462" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">PDF inspection · Pagination · Scaling · Clipping · Parity</text><rect x="24" y="485" width="912" height="72" rx="7" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488"/><rect x="38" y="500" width="42" height="42" rx="7" fill="#0d9488" fill-opacity="0.13" stroke="#0d9488"/><text x="59" y="527" font-size="20" font-weight="700" fill="#0d9488" text-anchor="middle">6</text><text x="96" y="507" font-size="17" font-weight="700" fill="#0d9488" text-anchor="start">Release &amp; Delivery</text><text x="96" y="527" font-size="14" font-weight="400" fill="#172033" text-anchor="start">Was the exact approved artifact delivered?</text><text x="96" y="544" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">Approval · Revision · File integrity · Destination</text><rect x="24" y="567" width="912" height="72" rx="7" fill="#475569" fill-opacity="0.08" stroke="#475569"/><rect x="38" y="582" width="42" height="42" rx="7" fill="#475569" fill-opacity="0.13" stroke="#475569"/><text x="59" y="609" font-size="20" font-weight="700" fill="#475569" text-anchor="middle">7</text><text x="96" y="589" font-size="17" font-weight="700" fill="#475569" text-anchor="start">Operational Completion &amp; Learning</text><text x="96" y="609" font-size="14" font-weight="400" fill="#172033" text-anchor="start">Is the run accountable and complete?</text><text x="96" y="626" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">RunLog · Evidence · Metrics · Defects · Improvements</text><text x="24" y="666" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">MTS • Level 1 Conceptual Foundation • Canonical review draft, revision 1</text></g></svg>
