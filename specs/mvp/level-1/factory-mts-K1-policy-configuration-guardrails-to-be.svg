<svg xmlns="http://www.w3.org/2000/svg" width="960" height="575" viewBox="0 0 960 575" role="img" aria-labelledby="title desc"><title id="title">Policy, Configuration &amp; Guardrails</title><desc id="desc">Policy defines boundaries; configuration sets permitted behavior; guardrails enforce.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="575" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Policy, Configuration &amp; Guardrails</text><text x="24" y="55" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Policy defines boundaries; configuration sets permitted behavior; guardrails enforce.</text><rect x="220" y="76" width="520" height="56" rx="7" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb"/><text x="480.0" y="100" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Intent</text><text x="480.0" y="121" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Desired outcome</text><path d="M480 132V150" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="220" y="151" width="520" height="76" rx="7" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed"/><text x="480.0" y="175" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">Policy</text><text x="480.0" y="196" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Rules, obligations and permissible boundaries</text><text x="480.0" y="214" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">What must, may or must not happen</text><path d="M480 227V247H240V266" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><path d="M480 247H720V266" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><text x="240" y="260" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Constrains</text><text x="720" y="260" font-size="12" font-weight="400" fill="#475569" text-anchor="middle">Requires controls</text><rect x="20" y="267" width="440" height="83" rx="7" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb"/><text x="240.0" y="291" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Configuration</text><text x="240.0" y="312" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Operating parameters · Counts · Profiles · Limits</text><text x="240.0" y="330" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Within allowed policy</text><rect x="500" y="267" width="440" height="83" rx="7" fill="#a16207" fill-opacity="0.06" stroke="#a16207"/><text x="720.0" y="291" font-size="17" font-weight="700" fill="#a16207" text-anchor="middle">Guardrails</text><text x="720.0" y="312" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Enforcement mechanisms · Checks · Gates · Restrictions</text><text x="720.0" y="330" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Prevent · Detect · Correct · Block · Escalate</text><path d="M460 309H500" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><text x="480" y="365" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Configuration can parameterize guardrails; it cannot silently waive binding policy.</text><path d="M240 350V384H480M720 350V384H480V400" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="220" y="401" width="520" height="61" rx="7" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488"/><text x="480.0" y="425" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">Governed execution</text><text x="480.0" y="446" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">AI · Harness · Code · Tools</text><path d="M480 462V481" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="220" y="482" width="520" height="62" rx="7" fill="#475569" fill-opacity="0.06" stroke="#475569"/><text x="480.0" y="506" font-size="17" font-weight="700" fill="#475569" text-anchor="middle">Verification &amp; evidence</text><text x="480.0" y="527" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Was intent realized within the boundaries?</text><text x="24" y="562" font-size="12" font-weight="400" fill="#475569" text-anchor="start">MTS • Level 1 Conceptual Foundation • Factory review candidate, revision 1</text></g></svg>
