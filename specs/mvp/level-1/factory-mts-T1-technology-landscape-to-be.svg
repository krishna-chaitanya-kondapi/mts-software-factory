<svg xmlns="http://www.w3.org/2000/svg" width="960" height="495" viewBox="0 0 960 495" role="img" aria-labelledby="title desc"><title id="title">T1 — Technology landscape</title><desc id="desc">Legacy operating environment and intended portability; not a deployment claim.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="495" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="23" y="32" font-size="25" font-weight="700" text-anchor="start" fill="#172033">T1 — Technology landscape</text><text x="23" y="56" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Legacy operating environment and intended portability; not a deployment claim.</text><rect x="23" y="80" width="914" height="50" rx="8" fill="#a16207" fill-opacity="0.07" stroke="#a16207" stroke-width="1.3"/><text x="38" y="110" font-size="16" font-weight="700" text-anchor="start" fill="#a16207">Human authority</text><text x="345" y="110" font-size="14" font-weight="400" text-anchor="start" fill="#172033">Educator · reviewer</text><rect x="23" y="140" width="914" height="50" rx="8" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-width="1.3"/><text x="38" y="170" font-size="16" font-weight="700" text-anchor="start" fill="#7c3aed">AI / intelligence</text><text x="345" y="170" font-size="14" font-weight="400" text-anchor="start" fill="#172033">OpenAI GPT (legacy baseline)</text><rect x="23" y="200" width="914" height="50" rx="8" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-width="1.3"/><text x="38" y="230" font-size="16" font-weight="700" text-anchor="start" fill="#2563eb">Harness / orchestration</text><text x="345" y="230" font-size="14" font-weight="400" text-anchor="start" fill="#172033">ChatGPT observed; Codex · Claude · Copilot portability target</text><rect x="23" y="260" width="914" height="50" rx="8" fill="#0d9488" fill-opacity="0.07" stroke="#0d9488" stroke-width="1.3"/><text x="38" y="290" font-size="16" font-weight="700" text-anchor="start" fill="#0d9488">Code &amp; tools</text><text x="345" y="290" font-size="14" font-weight="400" text-anchor="start" fill="#172033">Python · connectors · verification · document composition &amp; rendering</text><rect x="23" y="320" width="914" height="50" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="38" y="350" font-size="16" font-weight="700" text-anchor="start" fill="#475569">Knowledge &amp; persistence</text><text x="345" y="350" font-size="14" font-weight="400" text-anchor="start" fill="#172033">Google Drive · Sheets · Docs · GitHub · structured files</text><rect x="23" y="380" width="914" height="50" rx="8" fill="#a16207" fill-opacity="0.07" stroke="#a16207" stroke-width="1.3"/><text x="38" y="410" font-size="16" font-weight="700" text-anchor="start" fill="#a16207">External delivery</text><text x="345" y="410" font-size="14" font-weight="400" text-anchor="start" fill="#172033">Independent Windows printing · approved PrintReady PDFs</text><text x="480" y="456" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">Rendering baseline includes Google Docs / PDF export and ReportLab; PyMuPDF supports inspection.</text><text x="23" y="481" font-size="12" font-weight="400" text-anchor="start" fill="#64748b">MTS • Level 1 Conceptual Foundation • Canonical draft, revision 2</text></g></svg>
