<svg xmlns="http://www.w3.org/2000/svg" width="960" height="675" viewBox="0 0 960 675" role="img" aria-labelledby="title desc"><title id="title">V1 — Definition of Done Map</title><desc id="desc">Intent sets the target; verification measures the gap; bounded repair closes it.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="675" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">V1 — Definition of Done Map</text><text x="24" y="55" font-size="13" font-weight="400" fill="#64748b" text-anchor="start">Intent sets the target; verification measures the gap; bounded repair closes it.</text><rect x="300" y="75" width="360" height="60" rx="7" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb"/><text x="480.0" y="100" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Human Intent</text><text x="480.0" y="120" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Desired outcomes and approved scope</text><path d="M480 135V155" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><rect x="20" y="155" width="920" height="128" rx="7" fill="#7c3aed" fill-opacity="0.035" stroke="#7c3aed"/><text x="480" y="177" font-size="16" font-weight="700" fill="#7c3aed" text-anchor="middle">COMPLETION CONTRACT</text><rect x="34" y="187" width="292" height="58" rx="7" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed"/><text x="180.0" y="212" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">Requirements</text><text x="180.0" y="232" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">What must be true</text><rect x="334" y="187" width="292" height="58" rx="7" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed"/><text x="480.0" y="212" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">Verification layers</text><text x="480.0" y="232" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">What must be checked</text><rect x="634" y="187" width="292" height="58" rx="7" fill="#7c3aed" fill-opacity="0.08" stroke="#7c3aed"/><text x="780.0" y="212" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">Criteria &amp; rubrics</text><text x="780.0" y="232" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">What qualifies as success</text><text x="480" y="266" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Scope · Thresholds · Evidence · Exceptions · Budgets · Human gates</text><path d="M480 283V305" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><rect x="320" y="305" width="320" height="57" rx="7" fill="#2563eb" fill-opacity="0.08" stroke="#2563eb"/><text x="480.0" y="330" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Generate / Build / Execute</text><text x="480.0" y="350" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Produce candidate</text><path d="M480 362V382" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><rect x="320" y="382" width="320" height="62" rx="7" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488"/><text x="480.0" y="407" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">Independent Verification</text><text x="480.0" y="427" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Tests · Evaluations · Actual evidence</text><path d="M480 444V460" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><path d="M480 460L595 505L480 550L365 505Z" fill="#a16207" fill-opacity=".09" stroke="#a16207"/><text x="480" y="500" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Definition of</text><text x="480" y="519" font-size="15" font-weight="700" fill="#172033" text-anchor="middle">Done met?</text><rect x="20" y="474" width="235" height="65" rx="7" fill="#a16207" fill-opacity="0.08" stroke="#a16207"/><text x="137.5" y="499" font-size="17" font-weight="700" fill="#a16207" text-anchor="middle">Analyze gap &amp; repair</text><text x="137.5" y="519" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Reverify affected checks</text><path d="M365 505H255" fill="none" stroke="#a16207" stroke-width="1.6" marker-end="url(#a)"/><text x="310" y="492" font-size="12" font-weight="400" fill="#a16207" text-anchor="middle">No — repairable</text><path d="M138 474V333H320" fill="none" stroke="#a16207" stroke-width="1.6" marker-end="url(#a)"/><rect x="705" y="474" width="235" height="65" rx="7" fill="#b91c1c" fill-opacity="0.08" stroke="#b91c1c"/><text x="822.5" y="499" font-size="17" font-weight="700" fill="#b91c1c" text-anchor="middle">Block / Escalate</text><text x="822.5" y="519" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Limits or unresolved gaps</text><path d="M595 505H705" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><text x="650" y="492" font-size="12" font-weight="400" fill="#b91c1c" text-anchor="middle">Stop limit</text><path d="M480 550V575" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#a)"/><text x="495" y="566" font-size="12" font-weight="400" fill="#0d9488" text-anchor="start">Yes</text><rect x="275" y="575" width="410" height="66" rx="7" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488"/><text x="480.0" y="600" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">Ready for Human Acceptance</text><text x="480.0" y="620" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Verified evidence supports the decision</text><text x="24" y="661" font-size="12" font-weight="400" fill="#64748b" text-anchor="start">MTS • Level 1 Conceptual Foundation • Canonical review draft, revision 1</text></g></svg>
