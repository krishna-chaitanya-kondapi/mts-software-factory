<svg xmlns="http://www.w3.org/2000/svg" width="960" height="647" viewBox="0 0 960 647" role="img" aria-labelledby="title desc"><title id="title">Policy and configuration resolution</title><desc id="desc">Conceptual inputs, not a finalized precedence algorithm.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="647" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="24" y="32" font-size="23" font-weight="700" fill="#172033" text-anchor="start">Policy and configuration resolution</text><text x="24" y="55" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Conceptual inputs, not a finalized precedence algorithm.</text><rect x="130" y="76" width="700" height="61" rx="7" fill="#475569" fill-opacity="0.06" stroke="#475569"/><text x="480.0" y="100" font-size="17" font-weight="700" fill="#475569" text-anchor="middle">Factory-wide policies and defaults</text><text x="480.0" y="121" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Shared rules, engineering standards and controls</text><path d="M480 137V153" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="130" y="153" width="700" height="61" rx="7" fill="#7c3aed" fill-opacity="0.06" stroke="#7c3aed"/><text x="480.0" y="177" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="middle">Product and subject policies</text><text x="480.0" y="198" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">MTS · Math · ELA requirements</text><path d="M480 214V230" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="130" y="230" width="700" height="61" rx="7" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb"/><text x="480.0" y="254" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Workflow configuration</text><text x="480.0" y="275" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Weekly Practice · Mock Assessments · Topic Mastery</text><path d="M480 291V307" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="130" y="307" width="700" height="61" rx="7" fill="#2563eb" fill-opacity="0.06" stroke="#2563eb"/><text x="480.0" y="331" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Artifact profile</text><text x="480.0" y="352" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Presentation, rendering and verification settings</text><path d="M480 368V384" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="130" y="384" width="700" height="61" rx="7" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488"/><text x="480.0" y="408" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">Run-specific selections and authorized overrides</text><text x="480.0" y="429" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Scope · Sources · Counts · Applicable exceptions</text><path d="M480 445V461" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="130" y="461" width="700" height="76" rx="7" fill="#a16207" fill-opacity="0.06" stroke="#a16207"/><text x="480.0" y="485" font-size="17" font-weight="700" fill="#a16207" text-anchor="middle">Resolution &amp; conflict validation</text><text x="480.0" y="506" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Binding policy ≠ configurable default ≠ authorized exception</text><text x="480.0" y="524" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Missing authority or unresolved conflict blocks affected work</text><path d="M480 537V555" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="130" y="556" width="700" height="60" rx="7" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488"/><text x="480.0" y="580" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">Effective RunSpec</text><text x="480.0" y="601" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Approved, versioned execution contract</text><text x="24" y="634" font-size="12" font-weight="400" fill="#475569" text-anchor="start">MTS • Level 1 Conceptual Foundation • Factory review candidate, revision 1</text></g></svg>
