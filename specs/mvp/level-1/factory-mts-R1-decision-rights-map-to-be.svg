<svg xmlns="http://www.w3.org/2000/svg" width="960" height="435" viewBox="0 0 960 435" role="img" aria-labelledby="title desc"><title id="title">R1 — Responsibility and decision rights</title><desc id="desc">Logical roles may share a runtime; legacy MVP A1 = Authority.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="960" height="435" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><text x="23" y="32" font-size="25" font-weight="700" text-anchor="start" fill="#172033">R1 — Responsibility and decision rights</text><text x="23" y="56" font-size="14" font-weight="400" text-anchor="start" fill="#475569">Logical roles may share a runtime; legacy MVP A1 = Authority.</text><rect x="225" y="80" width="510" height="74" rx="8" fill="#a16207" fill-opacity="0.07" stroke="#a16207" stroke-width="1.3"/><text x="480.0" y="105" font-size="17" font-weight="700" text-anchor="middle" fill="#a16207">Human — owns decisions</text><text x="480.0" y="126" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Intent · material exceptions · release authorization</text><path d="M480 154V183" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><rect x="225" y="184" width="510" height="69" rx="8" fill="#2563eb" fill-opacity="0.07" stroke="#2563eb" stroke-width="1.3"/><text x="480.0" y="209" font-size="17" font-weight="700" text-anchor="middle" fill="#2563eb">Harness — coordinates</text><text x="480.0" y="230" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Orchestration · state · routing · enforce agreed gates</text><path d="M480 253V270H167V288" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><path d="M480 253V288" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><path d="M480 270H793V288" fill="none" stroke="#64748b" stroke-width="1.6"  marker-end="url(#a)"/><rect x="23" y="289" width="288" height="78" rx="8" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-width="1.3"/><text x="167.0" y="314" font-size="16" font-weight="700" text-anchor="middle" fill="#7c3aed">AI — reasons</text><text x="167.0" y="335" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Generate · semantic review</text><rect x="336" y="289" width="288" height="78" rx="8" fill="#0d9488" fill-opacity="0.07" stroke="#0d9488" stroke-width="1.3"/><text x="480.0" y="314" font-size="16" font-weight="700" text-anchor="middle" fill="#0d9488">Code &amp; tools — execute</text><text x="480.0" y="335" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Compose · render · verify</text><rect x="649" y="289" width="288" height="78" rx="8" fill="#475569" fill-opacity="0.07" stroke="#475569" stroke-width="1.3"/><text x="793.0" y="314" font-size="16" font-weight="700" text-anchor="middle" fill="#475569">Storage — preserves</text><text x="793.0" y="335" font-size="13" font-weight="400" text-anchor="middle" fill="#172033">Knowledge · artifacts · evidence</text><text x="480" y="397" font-size="14" font-weight="400" text-anchor="middle" fill="#475569">Independent verification does not replace human authority. Preserve all applicable subject-specific gates.</text><text x="23" y="421" font-size="12" font-weight="400" text-anchor="start" fill="#64748b">MTS • Level 1 Conceptual Foundation • Canonical draft, revision 2</text></g></svg>
