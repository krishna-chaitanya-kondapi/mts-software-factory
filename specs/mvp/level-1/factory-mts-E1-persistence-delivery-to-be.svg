t-weight="400" fill="#172033" text-anchor="middle">Production artifacts</text><path d="M720 191V210" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="12" y="211" width="936" height="119" rx="7" fill="#2563eb" fill-opacity="0.035" stroke="#2563eb"/><text x="480" y="235" font-size="17" font-weight="700" fill="#2563eb" text-anchor="middle">Dated production archive — Phase → Week</text><rect x="25" y="246" width="292" height="71" rx="7" fill="#475569" fill-opacity="0.06" stroke="#475569"/><text x="171.0" y="270" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">01-PreRun/</text><text x="171.0" y="291" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">YYYY-MM-DD/</text><text x="171.0" y="309" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">RunSpec PDF + JSON</text><rect x="334" y="246" width="292" height="71" rx="7" fill="#475569" fill-opacity="0.06" stroke="#475569"/><text x="480.0" y="270" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">02-Run/</text><text x="480.0" y="291" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">YYYY-MM-DD/</text><text x="480.0" y="309" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Worksheets + Keys</text><rect x="643" y="246" width="292" height="71" rx="7" fill="#475569" fill-opacity="0.06" stroke="#475569"/><text x="789.0" y="270" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">03-PostRun/</text><text x="789.0" y="291" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">YYYY-MM-DD/</text><text x="789.0" y="309" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">QA · Logs · Release Manifest</text><path d="M480 330V351H263V365" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><rect x="60" y="366" width="405" height="82" rx="7" fill="#0d9488" fill-opacity="0.06" stroke="#0d9488"/><text x="262.5" y="390" font-size="17" font-weight="700" fill="#0d9488" text-anchor="middle">Shared PrintReady/</text><text x="262.5" y="411" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Latest approved Math + ELA worksheets &amp; keys</text><text x="262.5" y="429" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Flat delivery folder · Not the historical archive</text><rect x="527" y="366" width="373" height="82" rx="7" fill="#a16207" fill-opacity="0.06" stroke="#a16207"/><text x="713.5" y="390" font-size="16" font-weight="700" fill="#a16207" text-anchor="middle">Independent Windows printing</text><text x="713.5" y="411" font-size="13" font-weight="400" fill="#172033" text-anchor="middle">Existing automated print function</text><path d="M465 407H527" stroke="#475569" stroke-width="1.6" fill="none"  marker-end="url(#a)"/><text x="480" y="472" font-size="14" font-weight="400" fill="#172033" text-anchor="middle">Validate → Clean previous release → Publish → Reconcile</text><text x="480" y="493" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Retain dated originals and same-week other-subject files; no new printer integration.</text><text x="480" y="511" font-size="13" font-weight="400" fill="#475569" text-anchor="middle">Drive replacement is not atomic; complete publication before scheduled printing.</text><text x="24" y="527" font-size="12" font-weight="400" fill="#475569" text-anchor="start">MTS • Level 1 Conceptual Foundation • Factory review candidate, revision 1</text></g></svg>
