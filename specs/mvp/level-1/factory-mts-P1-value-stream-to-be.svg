<svg xmlns="http://www.w3.org/2000/svg" width="860" height="183" viewBox="0 0 860 183" role="img" aria-labelledby="title desc"><title id="title">Educational product value stream</title><desc id="desc">Define, plan, create, verify, approve, deliver and improve</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#64748b"/></marker></defs><rect width="860" height="183" fill="white"/><g font-family="Arial, Liberation Sans, sans-serif"><rect x="6" y="27" width="132" height="61" rx="6" fill="#a16207" fill-opacity="0.09" stroke="#a16207"/><text x="72" y="51" font-size="16" font-weight="bold" text-anchor="middle" fill="#a16207">Define</text><text x="72" y="71" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#172033">Learning goals</text><path d="M138 58H149" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="149" y="27" width="132" height="61" rx="6" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb"/><text x="215" y="51" font-size="16" font-weight="bold" text-anchor="middle" fill="#2563eb">Plan</text><text x="215" y="71" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#172033">Curriculum &amp; scope</text><path d="M281 58H292" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="292" y="27" width="132" height="61" rx="6" fill="#7c3aed" fill-opacity="0.09" stroke="#7c3aed"/><text x="358" y="51" font-size="16" font-weight="bold" text-anchor="middle" fill="#7c3aed">Create</text><text x="358" y="71" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#172033">Educational content</text><path d="M424 58H435" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="435" y="27" width="132" height="61" rx="6" fill="#0d9488" fill-opacity="0.09" stroke="#0d9488"/><text x="501" y="51" font-size="16" font-weight="bold" text-anchor="middle" fill="#0d9488">Verify</text><text x="501" y="71" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#172033">Quality &amp; accuracy</text><path d="M567 58H578" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="578" y="27" width="132" height="61" rx="6" fill="#a16207" fill-opacity="0.09" stroke="#a16207"/><text x="644" y="51" font-size="16" font-weight="bold" text-anchor="middle" fill="#a16207">Approve</text><text x="644" y="71" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#172033">Human authority</text><path d="M710 58H721" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#a)"/><rect x="721" y="27" width="132" height="61" rx="6" fill="#2563eb" fill-opacity="0.09" stroke="#2563eb"/><text x="787" y="51" font-size="16" font-weight="bold" text-anchor="middle" fill="#2563eb">Deliver</text><text x="787" y="71" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#172033">Student / teacher</text><path d="M644 88V113H358V88" stroke="#d97706" stroke-width="1.4" fill="none" marker-end="url(#a)" stroke-dasharray="4 3"/><text x="500" y="106" font-size="11.5" font-weight="normal" text-anchor="middle" fill="#a16207">Revise and reverify if needed</text><rect x="281" y="135" width="298" height="38" rx="6" fill="#0d9488" fill-opacity="0.08" stroke="#0d9488"/><text x="430" y="158" font-size="14" font-weight="bold" text-anchor="middle" fill="#172033">Observe · Learn · Improve</text><path d="M787 88V154H579" stroke="#0d9488" stroke-width="1.4" fill="none" marker-end="url(#a)"/><path d="M281 154H72V88" stroke="#0d9488" stroke-width="1.4" fill="none" marker-end="url(#a)"/></g></svg>
